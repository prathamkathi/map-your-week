<body data-screen="welcome">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

    <header class="top" id="top" hidden>

      <div class="prog" id="prog">
        <div class="bar"><i id="bar"></i></div>
        <span class="plabel" id="plabel"></span>
      </div>
      <span class="count" id="count"></span>
    </header>
    <div class="chipline" id="chipline" hidden><span class="chip" id="chip" role="status"></span></div>
    <main class="stage" id="stage"></main>
  </div>
</div>
